name = "nihon101-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Postgres connection string lives in .dev.vars (local) and as a secret in prod
# (`wrangler secret put DATABASE_URL`). Local dev points at Docker Postgres,
# prod points at Neon.

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nihon101-media"

# Site-wide trending hot-cache (top-20 cards). Local dev (`wrangler dev`)
# simulates KV with miniflare regardless of id. For prod, create the namespace
# (`wrangler kv namespace create TRENDING_KV`) and paste the real id below.
[[kv_namespaces]]
binding = "TRENDING_KV"
id = "trending_kv_local"

# Exact atomic rate limiter for the auth brute-force class (login/register). One
# DO instance per (bucket, ip); KV's eventual consistency would let a multi-region
# burst leak past a strict cap, a DO is a single global actor so the count is exact.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

[triggers]
# Every 5 min: rescore momentum for the ACTIVE set (recent + freshly-engaged posts,
# not the whole corpus) + bake the top-20 to KV. Minute-0 also ages out stale reports.
# Sunday 00:00 UTC = Sunday 09:00 JST: send the weekly Sunday Letter (kill-switchable).
crons = ["*/5 * * * *", "0 0 * * 0"]

# In prod, set DB_POOLED = "true" here once Hyperdrive / Neon's pooler is in front
# (and point DATABASE_URL at it) so the Worker reuses one per-isolate pool instead
# of opening one per request. Left unset locally → direct Docker Postgres. See
# db/client.ts.
[vars]
FRONTEND_ORIGIN = "http://localhost:4321"
API_ORIGIN = "http://localhost:8787"
RESEND_FROM = "Nihon101 <no-reply@auth.nihon101.com>"
RESEND_FROM_NEWSLETTER = "Nihon101 Sunday Letter <sunday@news.nihon101.com>"
GOOGLE_REDIRECT_URI = "http://localhost:8787/auth/google/callback"
