name = "nihon101-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

# Postgres connection string lives in .dev.vars (local) and as a secret in prod
# (`wrangler secret put DATABASE_URL`). Local dev points at Docker Postgres,
# prod points at Neon.

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "nihon101-media"

# Server-side image re-encode (backup path only — normal uploads arrive as
# client-shrunk WebP and skip it). Free tier: 5k transformations/month.
# `wrangler dev` ships a local offline simulation of this binding.
[images]
binding = "IMAGES"

# Site-wide trending hot-cache (top-20 cards). Local dev (`wrangler dev`)
# simulates KV with miniflare regardless of id. For prod, create the namespace
# (`wrangler kv namespace create TRENDING_KV`) and paste the real id below.
[[kv_namespaces]]
binding = "TRENDING_KV"
id = "trending_kv_local"

# Exact atomic rate limiter for the auth brute-force class (login/register). One
# DO instance per (bucket, ip); KV's eventual consistency would let a multi-region
# burst leak past a strict cap, a DO is a single global actor so the count is exact.
[[durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "RateLimiterDO"

[[migrations]]
tag = "v1"
new_classes = ["RateLimiterDO"]

[triggers]
# Every 5 min: rescore momentum for the ACTIVE set (recent + freshly-engaged posts,
# not the whole corpus) + bake the top-20 to KV. Minute-0 also ages out stale reports.
# Sunday 00:00 UTC = Sunday 09:00 JST: send the weekly Sunday Letter (kill-switchable).
crons = ["*/5 * * * *", "0 0 * * 0"]

# PROD database path: TWO Hyperdrive configs in front of Neon (create with
# `wrangler hyperdrive create`), uncomment + paste the ids at deploy time.
#   • HYPERDRIVE        — caching DISABLED. The live handle: auth + everything
#     per-user. db/client.ts opens a fresh per-request pool over its local socket
#     (never reuse a pg socket across Worker invocations — it hangs; Not Bagel
#     hit this live 2026-07-07).
#   • HYPERDRIVE_CACHED — SAME Neon database, caching ON (60s). Content-only
#     reads opt in via getDbCached (post bodies, listings, search, trending,
#     categories, public profiles). Per-user data must never go through this.
# Local dev needs neither (getDbCached falls back to the live handle).
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "<hyperdrive-config-id-caching-disabled>"
# [[hyperdrive]]
# binding = "HYPERDRIVE_CACHED"
# id = "<hyperdrive-config-id-caching-60s>"
#
# DB_POOLED = "true" is the LEGACY no-Hyperdrive path (Neon `-pooler` direct with a
# shared isolate pool) — carries the socket-reuse hang risk on Workers; prefer
# Hyperdrive. Left unset locally → direct Docker Postgres. See db/client.ts.
[vars]
FRONTEND_ORIGIN = "http://localhost:4321"
API_ORIGIN = "http://localhost:8787"
RESEND_FROM = "Nihon101 <no-reply@auth.nihon101.com>"
RESEND_FROM_NEWSLETTER = "Nihon101 Sunday Letter <sunday@news.nihon101.com>"
GOOGLE_REDIRECT_URI = "http://localhost:8787/auth/google/callback"
