name = "not-bagel-backend"
main = "src/index.ts"
compatibility_date = "2025-06-01"
compatibility_flags = ["nodejs_compat"]

[vars]
FRONTEND_ORIGIN = "http://localhost:5173"

# `wrangler d1 create not_bagel` to provision prod and paste the real id here.
# Local dev uses the database_name; the id below is a placeholder.
[[d1_databases]]
binding = "DB"
database_name = "not_bagel"
database_id = "00000000-0000-0000-0000-000000000000"

# Image/media storage. Local dev simulates this in .wrangler/state automatically.
# For prod: `wrangler r2 bucket create not-bagel-media`.
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "not-bagel-media"
