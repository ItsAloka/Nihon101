<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nihon101 — Account mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBFAF7; --ink:#1A1817; --mute:#5C544C; --hinomaru:#D63752;
    --sakura:#E8A0AE; --tan:#D6C7B3; --line:#E8E2D8; --card:#FFFFFF;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:'Inter','Noto Sans JP',system-ui,sans-serif;
    background:var(--paper); color:var(--ink);
    -webkit-font-smoothing:antialiased; min-height:100vh;
  }
  ::selection{background:var(--sakura); color:#1E1813}
  .serif{font-family:'Shippori Mincho B1','Noto Serif JP',serif}

  /* top bar */
  .top{display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line)}
  .brand{font-family:'Shippori Mincho B1',serif; font-size:24px; font-weight:700; text-decoration:none; color:var(--ink)}
  .brand b{color:var(--hinomaru); font-weight:700}
  .langtoggle{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden; background:#fff}
  .langtoggle button{font:inherit; font-size:13px; font-weight:600; padding:6px 14px; border:0; background:transparent; color:var(--mute); cursor:pointer}
  .langtoggle button.on{background:var(--hinomaru); color:#fff}

  /* layout */
  .wrap{max-width:680px; margin:0 auto; padding:40px 20px 80px}
  .pagehead{margin:0 0 28px}
  .pagehead h1{font-family:'Shippori Mincho B1',serif; font-size:30px; margin:0 0 4px}
  .pagehead p{color:var(--mute); font-size:14px; margin:0}

  .section{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:24px 24px; margin-bottom:18px; box-shadow:0 1px 3px rgba(0,0,0,.03)}
  .section h2{font-size:16px; font-weight:700; margin:0 0 2px}
  .section .desc{color:var(--mute); font-size:13px; margin:0 0 18px}
  .section.danger{border-color:#F4C4CD; background:#FEFAFB}
  .section.danger h2{color:#A21E36}

  label{display:block; font-size:13px; font-weight:600; margin:0 0 6px; color:var(--ink)}
  .field{margin-bottom:16px}
  .inputwrap{position:relative}
  input[type=email],input[type=password],input[type=text]{
    width:100%; font:inherit; font-size:15px; padding:11px 13px; color:var(--ink);
    background:#fff; border:1px solid var(--tan); border-radius:10px; outline:none; transition:border-color .15s, box-shadow .15s}
  input:focus{border-color:var(--hinomaru); box-shadow:0 0 0 3px rgba(214,55,82,.12)}
  input:disabled,input[readonly]{background:#F5F2EC; color:var(--mute); cursor:not-allowed}
  .eye{position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:0; cursor:pointer;
    color:var(--mute); padding:4px; line-height:0}
  .hint{font-size:11.5px; color:var(--mute); margin-top:5px}
  .readonly-note{font-size:11.5px; color:var(--mute); margin-top:5px}

  .btn{font:inherit; font-weight:600; font-size:14px; padding:10px 18px; border:0; border-radius:10px; cursor:pointer; transition:filter .15s, background .15s}
  .btn-primary{background:var(--hinomaru); color:#fff}
  .btn-primary:hover{filter:brightness(.94)}
  .btn-ghost{background:#fff; color:var(--ink); border:1px solid var(--tan)}
  .btn-ghost:hover{background:#FAF8F4}
  .btn-danger{background:#fff; color:#A21E36; border:1px solid #F4C4CD}
  .btn-danger:hover{background:#FCE9EC}
  .btn-row{display:flex; justify-content:flex-end; gap:10px; margin-top:4px}

  /* google row */
  .conn{display:flex; align-items:center; gap:14px; padding:14px; border:1px solid var(--line); border-radius:12px}
  .conn svg{width:22px;height:22px; flex-shrink:0}
  .conn .meta{flex:1}
  .conn .meta .name{font-size:14px; font-weight:600}
  .conn .meta .state{font-size:12.5px; color:var(--mute)}
  .badge{font-size:12px; font-weight:600; padding:4px 11px; border-radius:999px}
  .badge.on{background:#E7F4EC; color:#2C7A4B}

  .ok-msg{background:#E7F4EC; border:1px solid #BFE3CD; color:#2C7A4B; font-size:13px; padding:9px 12px; border-radius:9px; margin-bottom:16px; display:none}
  .ok-msg.show{display:block}

  .backhome{margin-top:8px}
  .backhome a{color:var(--mute); text-decoration:none; font-size:13px}
  .backhome a:hover{color:var(--hinomaru)}
</style>
</head>
<body>

<div class="top">
  <a class="brand" href="#">nihon<b>101</b></a>
  <div class="langtoggle" id="langtoggle">
    <button data-lang="ja" class="on">日本語</button>
    <button data-lang="en">EN</button>
  </div>
</div>

<div class="wrap">
  <div class="backhome"><a href="#" data-t="back">← nihon101 ホームへ</a></div>
  <div class="pagehead">
    <h1 class="serif" data-t="title">アカウント</h1>
    <p data-t="subtitle">プロフィールとセキュリティの設定。</p>
  </div>

  <div class="ok-msg" id="okmsg" data-t="saved">変更を保存しました。</div>

  <!-- ============ PROFILE ============ -->
  <div class="section">
    <h2 data-t="profile.title">プロフィール</h2>
    <p class="desc" data-t="profile.desc">表示名はコメントなどに表示されます。</p>
    <div class="field">
      <label data-t="profile.name">表示名</label>
      <input type="text" value="Haru" placeholder="Haru / はる">
    </div>
    <div class="field">
      <label data-t="profile.email">メールアドレス</label>
      <input type="email" value="you@example.com" readonly>
      <div class="readonly-note" data-t="profile.emailnote">メールアドレスは変更できません。</div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" data-t="profile.save">変更を保存</button>
    </div>
  </div>

  <!-- ============ PASSWORD ============ -->
  <div class="section">
    <h2 data-t="pw.title">パスワードの変更</h2>
    <p class="desc" data-t="pw.desc">安全のため、現在のパスワードを入力してください。</p>
    <div class="field">
      <label data-t="pw.current">現在のパスワード</label>
      <div class="inputwrap">
        <input type="password" class="pw" placeholder="••••••••">
        <button class="eye" type="button" aria-label="show/hide"></button>
      </div>
    </div>
    <div class="field">
      <label data-t="pw.new">新しいパスワード</label>
      <div class="inputwrap">
        <input type="password" class="pw" placeholder="8文字以上">
        <button class="eye" type="button" aria-label="show/hide"></button>
      </div>
      <div class="hint" data-t="pw.hint">8文字以上、英字と数字を含めてください。</div>
    </div>
    <div class="field">
      <label data-t="pw.confirm">新しいパスワード（確認）</label>
      <div class="inputwrap">
        <input type="password" class="pw" placeholder="••••••••">
        <button class="eye" type="button" aria-label="show/hide"></button>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" data-t="pw.save">パスワードを変更</button>
    </div>
  </div>

  <!-- ============ CONNECTED ============ -->
  <div class="section">
    <h2 data-t="conn.title">連携アカウント</h2>
    <p class="desc" data-t="conn.desc">ソーシャルログインの連携状況。</p>
    <div class="conn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.6 2.6 30.2 0 24 0 14.6 0 6.4 5.4 2.5 13.3l7.8 6.1C12.2 13.2 17.6 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.6c0-1.6-.1-2.8-.4-4.1H24v7.7h12.4c-.3 2-1.6 5-4.6 7l7.1 5.5c4.2-3.9 6.6-9.6 6.6-16.1z"/><path fill="#FBBC05" d="M10.3 28.6c-.5-1.5-.8-3-.8-4.6s.3-3.1.8-4.6l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.1-5.5c-2 1.3-4.6 2.3-8.8 2.3-6.4 0-11.8-3.7-13.7-9.9l-7.8 6.1C6.4 42.6 14.6 48 24 48z"/></svg>
      <div class="meta">
        <div class="name">Google</div>
        <div class="state" data-t="conn.gstate">you@gmail.com で連携済み</div>
      </div>
      <span class="badge on" data-t="conn.gbadge">連携済み</span>
    </div>
  </div>

  <!-- ============ DANGER ============ -->
  <div class="section danger">
    <h2 data-t="danger.title">アカウントの削除</h2>
    <p class="desc" data-t="danger.desc">削除すると、投稿・コメント・すべてのデータが完全に消えます。この操作は取り消せません。</p>
    <div class="btn-row" style="justify-content:flex-start">
      <button class="btn btn-danger" data-t="danger.btn">アカウントを削除</button>
    </div>
  </div>
</div>

<script>
const T = {
  ja:{
    'back':'← nihon101 ホームへ',
    'title':'設定','subtitle':'プロフィールとセキュリティの設定。',
    'saved':'変更を保存しました。',
    'profile.title':'プロフィール','profile.desc':'表示名はコメントなどに表示されます。',
    'profile.name':'表示名','profile.email':'メールアドレス',
    'profile.emailnote':'メールアドレスは変更できません。','profile.save':'変更を保存',
    'pw.title':'パスワードの変更','pw.desc':'安全のため、現在のパスワードを入力してください。',
    'pw.current':'現在のパスワード','pw.new':'新しいパスワード','pw.confirm':'新しいパスワード（確認）',
    'pw.hint':'8文字以上、英字と数字を含めてください。','pw.save':'パスワードを変更',
    'conn.title':'連携アカウント','conn.desc':'ソーシャルログインの連携状況。',
    'conn.gstate':'you@gmail.com で連携済み','conn.gbadge':'連携済み',
    'danger.title':'アカウントの削除',
    'danger.desc':'削除すると、投稿・コメント・すべてのデータが完全に消えます。この操作は取り消せません。',
    'danger.btn':'アカウントを削除',
  },
  en:{
    'back':'← Back to nihon101 home',
    'title':'Settings','subtitle':'Your profile and security settings.',
    'saved':'Changes saved.',
    'profile.title':'Profile','profile.desc':'Your display name appears on comments.',
    'profile.name':'Display name','profile.email':'Email',
    'profile.emailnote':'Your email address cannot be changed.','profile.save':'Save changes',
    'pw.title':'Change password','pw.desc':'For security, enter your current password.',
    'pw.current':'Current password','pw.new':'New password','pw.confirm':'Confirm new password',
    'pw.hint':'At least 8 characters, with letters and numbers.','pw.save':'Change password',
    'conn.title':'Connected accounts','conn.desc':'Your social login connections.',
    'conn.gstate':'Connected as you@gmail.com','conn.gbadge':'Connected',
    'danger.title':'Delete account',
    'danger.desc':'Deleting removes your posts, comments, and all data permanently. This cannot be undone.',
    'danger.btn':'Delete account',
  }
};

let lang='ja';
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-t]').forEach(el=>{
    const k=el.getAttribute('data-t'); if(T[lang][k]!==undefined) el.textContent=T[lang][k];
  });
}
document.getElementById('langtoggle').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b)return;
  lang=b.dataset.lang;
  document.querySelectorAll('#langtoggle button').forEach(x=>x.classList.toggle('on',x===b));
  applyLang();
});

// eye toggle
const EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10 10 0 0 1 12 19c-6.5 0-10-7-10-7a18 18 0 0 1 5.06-5.94M9.9 4.24A9 9 0 0 1 12 4c6.5 0 10 7 10 7a18 18 0 0 1-2.16 3.19"/><line x1="2" y1="2" x2="22" y2="22"/></svg>';
document.querySelectorAll('.eye').forEach(e=>e.innerHTML=EYE);
document.addEventListener('click',e=>{
  const eye=e.target.closest('.eye'); if(!eye)return;
  const input=eye.parentElement.querySelector('input');
  const shown=input.type==='text';
  input.type=shown?'password':'text';
  eye.innerHTML=shown?EYE:EYEOFF;
});

applyLang();
</script>
</body>
</html>
