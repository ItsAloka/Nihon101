<!doctype html>
<html lang="en" data-mode="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Trending — nihon101</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="site-header"></div>
  <div class="wrap section">
    <div class="ex-kicker"><svg class="wave" viewBox="0 0 28 8"><path d="M1 4 Q 5 0, 9 4 T 17 4 T 27 4" stroke="var(--stamp)" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg> Trending</div>
    <h1 class="ex">What people are reading now.</h1>
    <p class="ex-sub">Ranked by momentum — recent likes, comments and reads, updated by the minute.</p>
    <div class="list-bar"><div class="results-count" id="count"></div></div>
    <div id="results"></div>
  </div>
  <div id="site-footer"></div>

  <script src="data.js"></script>
  <script src="ui.js"></script>
  <script>
    ENUI.mount('trending');
    const E = ENUI;
    const list = E.sortPosts(E.POSTS, 'trend');
    document.getElementById('count').textContent = String(list.length).padStart(2, '0') + ' stories';
    document.getElementById('results').innerHTML = E.grid(list);
  </script>
</body>
</html>
