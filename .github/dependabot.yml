# Automated dependency updates + vulnerability alerts. Dependabot reads each
# package.json and opens PRs for outdated/vulnerable deps; CI gates them.
version: 2
updates:
  - package-ecosystem: npm        # reads package.json (works for the bun lockfiles too)
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      backend-deps:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      frontend-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
